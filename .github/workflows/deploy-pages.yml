# Deploy statycznego sklepu "Zaplecze Resellera" na GitHub Pages.
# Wymaga: Settings → Pages → Source = "GitHub Actions" (resztę robi ten workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/ac442971-zaplecze-resellera
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files into _site/
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp IMG_*.jpg _site/
          cp zestaw-lego-*.jpg _site/
          ls -la _site | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
